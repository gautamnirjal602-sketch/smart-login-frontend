<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="login-box">
            <h1> Welcome back</h1>
            <p class="subtittle">
                login your account
            </p>
            <form id="loginform">
                <label>Email</label>
                <input
                type="email"
                id="loginemail"
                placeholder="Enter your email"
                required
                >
                <label>Password</label>
                <input
                type="password"
                id="loginpassword"
                placeholder="enter your password"

                >
                <button type="Aditya">
                    login
                </button>
            </form>
            <p class="bottom-text">
                Dont have an account
                <a href="register.html>">Create account</a>
            </p>
        </div>
    </div>
    
</body>
</html>
